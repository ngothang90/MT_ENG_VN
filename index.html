<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live Translator Pro</title>

  <!-- iOS & Android PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dịch Live Pro">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1120">

  <!-- Manifest External Link -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898150.png">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100dvh;
      background-color: #0b1120;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Đệm an toàn tránh tai thỏ và vạch vuốt trang chủ iOS */
    body {
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }
    
    .scroll-touch {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .card-solid {
      background: #1e293b;
      border: 1px solid #334155;
    }

    .mic-active {
      animation: pulse-ring 1.5s infinite ease-in-out;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] max-w-7xl mx-auto">

  <!-- Header Section (Nâng khoảng cách tránh tai thỏ/Dynamic Island) -->
  <header class="card-solid rounded-2xl p-2.5 flex items-center justify-between gap-2 shrink-0 shadow-md mb-2 mt-1">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-sky-600 flex items-center justify-center text-white shrink-0 font-bold shadow-md">
        <i class="fa-solid fa-language text-lg"></i>
      </div>
      <div>
        <h1 class="text-xs md:text-lg font-extrabold text-white leading-tight">Live Translator Pro</h1>
        <span class="text-[9px] md:text-xs text-sky-400 font-medium hidden sm:inline-block">Tự Nhận Diện Người Nói</span>
      </div>
    </div>

    <!-- Mode Selector Switcher -->
    <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
      <button id="tabModeOneWay" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition bg-sky-600 text-white shadow">
        1 Chiều
      </button>
      <button id="tabModeTwoWay" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">
        Song Ngữ
      </button>
    </div>
  </header>

  <!-- ==================== CONTENT AREA ==================== -->
  <div class="flex-1 flex flex-col min-h-0 overflow-hidden gap-2">
    
    <!-- MODE 1: PHIÊN DỊCH 1 CHIỀU -->
    <main id="modeOneWayView" class="flex-1 flex flex-col gap-2 min-h-0">
      <!-- Controls Toolbar -->
      <div class="card-solid rounded-xl p-2 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2 flex-1">
          <div class="flex-1">
            <label class="text-[9px] text-slate-400 font-bold uppercase block mb-0.5">Nguồn (Nghe)</label>
            <select id="m1SrcLang" class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs font-semibold rounded-lg p-1.5 outline-none">
              <option value="ja-JP">🇯🇵 Tiếng Nhật</option>
              <option value="en-US">🇬🇧 Tiếng Anh</option>
              <option value="vi-VN">🇻🇳 Tiếng Việt</option>
              <option value="ko-KR">🇰🇷 Tiếng Hàn</option>
              <option value="zh-CN">🇨🇳 Tiếng Trung</option>
            </select>
          </div>

          <button id="btnSwapM1" class="w-7 h-7 rounded-full bg-slate-800 text-sky-400 flex items-center justify-center border border-slate-700 mt-3 shrink-0 active:scale-95" title="Đổi ngôn ngữ">
            <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
          </button>

          <div class="flex-1">
            <label class="text-[9px] text-slate-400 font-bold uppercase block mb-0.5">Đích (Dịch)</label>
            <select id="m1TgtLang" class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs font-semibold rounded-lg p-1.5 outline-none">
              <option value="vi-VN">🇻🇳 Tiếng Việt</option>
              <option value="ja-JP">🇯🇵 Tiếng Nhật</option>
              <option value="en-US">🇬🇧 Tiếng Anh</option>
              <option value="ko-KR">🇰🇷 Tiếng Hàn</option>
              <option value="zh-CN">🇨🇳 Tiếng Trung</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Live Real-time Subtitle Box -->
      <div class="card-solid rounded-xl p-2.5 border-l-4 border-l-amber-400 shrink-0">
        <div class="flex items-center justify-between text-[10px] font-bold text-slate-400 uppercase mb-1">
          <span class="flex items-center gap-1 text-amber-400">
            <i class="fa-solid fa-bolt"></i> Realtime: <b id="currentDetectedSpeaker" class="text-sky-300 ml-1">👤 Người A</b>
          </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-1.5">
          <div>
            <span class="text-[9px] font-mono text-sky-400 font-bold uppercase">Gốc:</span>
            <p id="m1LiveOrigText" class="text-xs text-slate-300 italic truncate">Đang lắng nghe...</p>
          </div>
          <div class="md:border-l md:border-slate-800 md:pl-2">
            <span class="text-[9px] font-mono text-amber-400 font-bold uppercase">Dịch:</span>
            <p id="m1LiveTransText" class="text-xs md:text-sm font-bold text-amber-300">---</p>
          </div>
        </div>
      </div>

      <!-- Feed Container -->
      <div id="m1Feed" class="flex-1 card-solid rounded-xl p-2.5 overflow-y-auto scroll-touch space-y-2 min-h-0">
        <div id="m1Empty" class="h-full flex flex-col items-center justify-center text-slate-500 text-center p-4">
          <i class="fa-solid fa-microphone-lines text-2xl mb-1 text-slate-600"></i>
          <p class="text-xs font-semibold text-slate-300">Tự động phân tách giọng người nói</p>
          <p class="text-[10px] text-slate-500">Nhấn nút bên dưới để bắt đầu.</p>
        </div>
      </div>
    </main>

    <!-- MODE 2: SONG NGỮ DIRECT -->
    <main id="modeTwoWayView" class="flex-1 flex flex-col gap-2 min-h-0 hidden">
      <div class="card-solid rounded-xl p-2 flex items-center justify-between gap-2 shrink-0">
        <!-- Tôi Nói -->
        <div class="flex-1">
          <label class="text-[9px] text-sky-400 font-bold uppercase block mb-0.5">Tôi Nói</label>
          <select id="m2UserLang" class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs font-semibold rounded-lg p-1.5 outline-none">
            <option value="vi-VN">🇻🇳 Tiếng Việt</option>
            <option value="ja-JP">🇯🇵 Tiếng Nhật</option>
            <option value="en-US">🇬🇧 Tiếng Anh</option>
            <option value="ko-KR">🇰🇷 Tiếng Hàn</option>
            <option value="zh-CN">🇨🇳 Tiếng Trung</option>
          </select>
        </div>

        <!-- Đối Phương -->
        <div class="flex-1">
          <label class="text-[9px] text-amber-400 font-bold uppercase block mb-0.5">Đối Phương</label>
          <select id="m2PartnerLang" class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs font-semibold rounded-lg p-1.5 outline-none">
            <option value="ja-JP">🇯🇵 Tiếng Nhật</option>
            <option value="vi-VN">🇻🇳 Tiếng Việt</option>
            <option value="en-US">🇬🇧 Tiếng Anh</option>
            <option value="ko-KR">🇰🇷 Tiếng Hàn</option>
            <option value="zh-CN">🇨🇳 Tiếng Trung</option>
          </select>
        </div>

        <button id="btnToggleAutoTTS" class="mt-3 px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-[10px] font-bold text-emerald-400 shrink-0">
          <span id="autoTtsStatus">Đọc: ON</span>
        </button>
      </div>

      <div id="m2Feed" class="flex-1 card-solid rounded-xl p-2.5 overflow-y-auto scroll-touch space-y-2 min-h-0">
        <div id="m2Empty" class="h-full flex flex-col items-center justify-center text-slate-500 text-center p-4">
          <i class="fa-solid fa-comments text-2xl mb-1 text-slate-600"></i>
          <p class="text-xs font-semibold text-slate-300">Hội thoại trực tiếp song ngữ</p>
        </div>
      </div>
    </main>

  </div>

  <!-- ==================== CỤM ĐIỀU KHIỂN BẤM & LỌC ÂM (NÂNG CAO TRÁNH VẠCH VUỐT) ==================== -->
  <div class="shrink-0 pt-2 flex flex-col gap-2 bg-[#0b1120] z-50">
    
    <!-- Action Buttons cho Chế độ 1 Chiều -->
    <div id="m1ActionButtons" class="flex items-center gap-2">
      <button id="btnStartM1" class="flex-1 py-3 rounded-xl font-extrabold text-xs md:text-sm bg-emerald-500 text-slate-950 flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
        <i class="fa-solid fa-play"></i> <span id="btnStartM1Text">BẮT ĐẦU NGHE</span>
      </button>
      <button id="btnClearM1" class="px-3.5 py-3 rounded-xl bg-slate-800 text-slate-400 border border-slate-700 flex items-center justify-center shrink-0 font-bold text-xs">
        <i class="fa-solid fa-trash-can text-sm"></i>
      </button>
    </div>

    <!-- Action Buttons cho Chế độ Song Ngữ -->
    <div id="m2ActionButtons" class="grid grid-cols-2 gap-2 hidden">
      <button id="btnMicUser" class="py-3 px-2 rounded-xl bg-sky-600 text-white font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg active:scale-95">
        <i class="fa-solid fa-microphone text-sm"></i>
        <span>TÔI NÓI (<span id="lblUserLang">VN</span>)</span>
      </button>

      <button id="btnMicPartner" class="py-3 px-2 rounded-xl bg-amber-600 text-white font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg active:scale-95">
        <i class="fa-solid fa-microphone text-sm"></i>
        <span>ĐỐI PHƯƠNG (<span id="lblPartnerLang">JA</span>)</span>
      </button>
    </div>

    <!-- NẮM NẰM NGAY DƯỚI CÁC NÚT BẤM (Đã nâng khoảng cách không chạm vạch Home iOS) -->
    <div class="card-solid rounded-xl px-3 py-1.5 flex items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2 flex-1 max-w-xs">
        <i class="fa-solid fa-volume-high text-amber-400 text-xs"></i>
        <span class="text-[10px] font-bold text-slate-400 shrink-0">Lọc Âm:</span>
        <input type="range" id="gainSlider" min="100" max="300" value="180" step="10" class="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-amber-400">
        <span id="gainValText" class="text-[10px] font-mono font-bold text-amber-400 shrink-0">180%</span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="statusText" class="text-[10px] text-slate-400">Sẵn sàng</span>
      </div>
    </div>

  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Ready:', reg.scope))
          .catch(err => console.log('SW Error:', err));
      });
    }

    const speakerBadges = [
      { name: 'Người A', badgeBg: 'bg-sky-950 text-sky-300 border-sky-500/50' },
      { name: 'Người B', badgeBg: 'bg-amber-950 text-amber-300 border-amber-500/50' },
      { name: 'Người C', badgeBg: 'bg-purple-950 text-purple-300 border-purple-500/50' },
      { name: 'Người D', badgeBg: 'bg-emerald-950 text-emerald-300 border-emerald-500/50' }
    ];

    let knownSpeakers = []; 
    let currentPhrasePitches = []; 
    let activeSpeakerIdx = 0;
    let lastSpeechEndTime = Date.now();

    let currentAppMode = 'oneWay';
    let isListeningMode1 = false;
    let activeTwoWayMic = null;
    let autoTTS = true;
    let gainMultiplier = 1.8;

    let audioCtx = null;
    let mediaStream = null;
    let gainNode = null;
    let analyserNode = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let interimDebounce = null;

    const tabModeOneWay = document.getElementById('tabModeOneWay');
    const tabModeTwoWay = document.getElementById('tabModeTwoWay');
    const modeOneWayView = document.getElementById('modeOneWayView');
    const modeTwoWayView = document.getElementById('modeTwoWayView');
    const m1ActionButtons = document.getElementById('m1ActionButtons');
    const m2ActionButtons = document.getElementById('m2ActionButtons');

    const m1SrcLang = document.getElementById('m1SrcLang');
    const m1TgtLang = document.getElementById('m1TgtLang');
    const btnSwapM1 = document.getElementById('btnSwapM1');
    const btnStartM1 = document.getElementById('btnStartM1');
    const btnStartM1Text = document.getElementById('btnStartM1Text');
    const btnClearM1 = document.getElementById('btnClearM1');
    const m1LiveOrigText = document.getElementById('m1LiveOrigText');
    const m1LiveTransText = document.getElementById('m1LiveTransText');
    const m1Feed = document.getElementById('m1Feed');
    const m1Empty = document.getElementById('m1Empty');
    const currentDetectedSpeaker = document.getElementById('currentDetectedSpeaker');

    const m2UserLang = document.getElementById('m2UserLang');
    const m2PartnerLang = document.getElementById('m2PartnerLang');
    const btnMicUser = document.getElementById('btnMicUser');
    const btnMicPartner = document.getElementById('btnMicPartner');
    const lblUserLang = document.getElementById('lblUserLang');
    const lblPartnerLang = document.getElementById('lblPartnerLang');
    const m2Feed = document.getElementById('m2Feed');
    const m2Empty = document.getElementById('m2Empty');
    const btnToggleAutoTTS = document.getElementById('btnToggleAutoTTS');
    const autoTtsStatus = document.getElementById('autoTtsStatus');

    const gainSlider = document.getElementById('gainSlider');
    const gainValText = document.getElementById('gainValText');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const langNames = { 
      'vi-VN': 'VN', 
      'ja-JP': 'JA', 
      'en-US': 'EN', 
      'ko-KR': 'KO', 
      'zh-CN': 'ZH' 
    };

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
        statusText.innerText = "Đang thu...";
      };

      recognition.onresult = (event) => {
        let interimStr = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const trans = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            handleFinalSentence(trans.trim());
            interimStr = '';
          } else {
            interimStr += trans;
          }
        }
        if (interimStr.trim().length > 0) {
          handleInterimSentence(interimStr.trim());
        }
      };

      recognition.onend = () => {
        statusDot.className = "w-2 h-2 rounded-full bg-slate-500";
        statusText.innerText = "Sẵn sàng";
        if (currentAppMode === 'oneWay' && isListeningMode1) {
          try { recognition.start(); } catch(e){}
        } else if (currentAppMode === 'twoWay' && activeTwoWayMic) {
          resetTwoWayButtons();
        }
      };
    }

    // Tab switcher logic
    tabModeOneWay.addEventListener('click', () => {
      currentAppMode = 'oneWay';
      tabModeOneWay.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold transition bg-sky-600 text-white shadow";
      tabModeTwoWay.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
      modeOneWayView.classList.remove('hidden');
      modeTwoWayView.classList.add('hidden');
      m1ActionButtons.classList.remove('hidden');
      m2ActionButtons.classList.add('hidden');
      stopAudioAndSpeech();
    });

    tabModeTwoWay.addEventListener('click', () => {
      currentAppMode = 'twoWay';
      tabModeTwoWay.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold transition bg-amber-600 text-white shadow";
      tabModeOneWay.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
      modeTwoWayView.classList.remove('hidden');
      modeOneWayView.classList.add('hidden');
      m2ActionButtons.classList.remove('hidden');
      m1ActionButtons.classList.add('hidden');
      stopAudioAndSpeech();
    });

    btnSwapM1.addEventListener('click', () => {
      const tmp = m1SrcLang.value;
      m1SrcLang.value = m1TgtLang.value;
      m1TgtLang.value = tmp;
      if (isListeningMode1) restartSpeechEngine(m1SrcLang.value);
    });

    btnStartM1.addEventListener('click', async () => {
      if (!isListeningMode1) {
        isListeningMode1 = true;
        btnStartM1.className = "flex-1 py-3 rounded-xl font-extrabold text-xs md:text-sm bg-rose-500 text-white flex items-center justify-center gap-2 shadow-lg mic-active";
        btnStartM1Text.innerText = "DỪNG NGHE";
        await startAudioPipeline();
        restartSpeechEngine(m1SrcLang.value);
      } else {
        isListeningMode1 = false;
        btnStartM1.className = "flex-1 py-3 rounded-xl font-extrabold text-xs md:text-sm bg-emerald-500 text-slate-950 flex items-center justify-center gap-2 shadow-lg";
        btnStartM1Text.innerText = "BẮT ĐẦU NGHE";
        stopAudioAndSpeech();
      }
    });

    btnClearM1.addEventListener('click', () => {
      m1Feed.innerHTML = '';
      m1Feed.appendChild(m1Empty);
      m1Empty.style.display = 'flex';
      knownSpeakers = [];
    });

    btnMicUser.addEventListener('click', async () => {
      if (activeTwoWayMic === 'user') {
        stopAudioAndSpeech();
        resetTwoWayButtons();
      } else {
        stopAudioAndSpeech();
        activeTwoWayMic = 'user';
        btnMicUser.className = "py-3 px-2 rounded-xl bg-rose-600 text-white font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg mic-active";
        btnMicPartner.className = "py-3 px-2 rounded-xl bg-amber-600/40 text-slate-400 font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 opacity-50";
        await startAudioPipeline();
        restartSpeechEngine(m2UserLang.value);
      }
    });

    btnMicPartner.addEventListener('click', async () => {
      if (activeTwoWayMic === 'partner') {
        stopAudioAndSpeech();
        resetTwoWayButtons();
      } else {
        stopAudioAndSpeech();
        activeTwoWayMic = 'partner';
        btnMicPartner.className = "py-3 px-2 rounded-xl bg-rose-600 text-white font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg mic-active";
        btnMicUser.className = "py-3 px-2 rounded-xl bg-sky-600/40 text-slate-400 font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 opacity-50";
        await startAudioPipeline();
        restartSpeechEngine(m2PartnerLang.value);
      }
    });

    function resetTwoWayButtons() {
      activeTwoWayMic = null;
      btnMicUser.className = "py-3 px-2 rounded-xl bg-sky-600 text-white font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg";
      btnMicPartner.className = "py-3 px-2 rounded-xl bg-amber-600 text-white font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg";
    }

    btnToggleAutoTTS.addEventListener('click', () => {
      autoTTS = !autoTTS;
      autoTtsStatus.innerText = `Đọc: ${autoTTS ? 'ON' : 'OFF'}`;
    });

    m2UserLang.addEventListener('change', () => lblUserLang.innerText = langNames[m2UserLang.value] || 'VN');
    m2PartnerLang.addEventListener('change', () => lblPartnerLang.innerText = langNames[m2PartnerLang.value] || 'JA');

    function handleInterimSentence(text) {
      if (currentAppMode === 'oneWay') {
        m1LiveOrigText.innerText = text;
        clearTimeout(interimDebounce);
        interimDebounce = setTimeout(async () => {
          const src = m1SrcLang.value.split('-')[0];
          const tgt = m1TgtLang.value.split('-')[0];
          const trans = await translateTextAPI(text, src, tgt);
          m1LiveTransText.innerText = trans || '...';
        }, 150);
      }
    }

    async function handleFinalSentence(originalText) {
      if (!originalText || originalText.length === 0) return;

      if (currentAppMode === 'oneWay') {
        m1Empty.style.display = 'none';
        m1LiveOrigText.innerText = '...';
        m1LiveTransText.innerText = '---';

        let avgPitch = 150;
        if (currentPhrasePitches.length > 0) {
          avgPitch = currentPhrasePitches.reduce((a, b) => a + b, 0) / currentPhrasePitches.length;
        }
        currentPhrasePitches = []; 

        const now = Date.now();
        const pauseDuration = now - lastSpeechEndTime;
        lastSpeechEndTime = now;

        activeSpeakerIdx = autoClusterSpeaker(avgPitch, pauseDuration);
        const currentSpkObj = speakerBadges[activeSpeakerIdx] || speakerBadges[0];
        currentDetectedSpeaker.innerText = `👤 ${currentSpkObj.name}`;

        const src = m1SrcLang.value.split('-')[0];
        const tgt = m1TgtLang.value.split('-')[0];
        const translated = await translateTextAPI(originalText, src, tgt);

        appendOneWayDualColumnCard(originalText, translated, activeSpeakerIdx, m1TgtLang.value);

      } else if (currentAppMode === 'twoWay') {
        m2Empty.style.display = 'none';
        const isUser = (activeTwoWayMic === 'user');
        const srcLang = isUser ? m2UserLang.value : m2PartnerLang.value;
        const tgtLang = isUser ? m2PartnerLang.value : m2UserLang.value;

        const src = srcLang.split('-')[0];
        const tgt = tgtLang.split('-')[0];
        const translated = await translateTextAPI(originalText, src, tgt);

        appendTwoWayBubble(originalText, translated, isUser, tgtLang);

        if (autoTTS && translated) speakText(translated, tgtLang);
        stopAudioAndSpeech();
        resetTwoWayButtons();
      }
    }

    function autoClusterSpeaker(avgPitch, pauseMs) {
      if (knownSpeakers.length === 0) {
        knownSpeakers.push(avgPitch);
        return 0; 
      }

      let minDiff = 9999;
      let matchedIdx = 0;

      for (let i = 0; i < knownSpeakers.length; i++) {
        const diff = Math.abs(knownSpeakers[i] - avgPitch);
        if (diff < minDiff) {
          minDiff = diff;
          matchedIdx = i;
        }
      }

      if (minDiff > 28 && knownSpeakers.length < 4) {
        knownSpeakers.push(avgPitch);
        return knownSpeakers.length - 1; 
      }

      if (pauseMs > 2000 && knownSpeakers.length > 1 && minDiff > 12) {
        return matchedIdx;
      }

      knownSpeakers[matchedIdx] = (knownSpeakers[matchedIdx] * 0.7) + (avgPitch * 0.3); 
      return matchedIdx;
    }

    function appendOneWayDualColumnCard(orig, trans, speakerIdx, tgtLangCode) {
      const spk = speakerBadges[speakerIdx] || speakerBadges[0];
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const row = document.createElement('div');
      row.className = "grid grid-cols-1 md:grid-cols-2 gap-2 p-2 rounded-xl bg-slate-900 border border-slate-800";

      const safeOrig = escapeHtml(orig);
      const safeTrans = escapeHtml(trans);

      row.innerHTML = `
        <div class="space-y-1">
          <div class="flex items-center justify-between text-[10px] font-mono">
            <span class="px-1.5 py-0.5 rounded font-bold ${spk.badgeBg} border">👤 ${spk.name}</span>
            <span class="text-slate-500">${timeStr}</span>
          </div>
          <p class="text-slate-100 font-medium text-xs">${safeOrig}</p>
        </div>

        <div class="space-y-1 md:border-l md:border-slate-800 md:pl-2 pt-1 md:pt-0 border-t md:border-t-0 border-slate-800">
          <div class="flex items-center justify-between text-[10px] font-mono">
            <span class="text-emerald-400 font-bold uppercase">🇻🇳 Dịch</span>
            <button onclick="speakText('${safeTrans.replace(/'/g, "\\'")}', '${tgtLangCode}')" class="text-amber-400 p-0.5">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>
          </div>
          <p class="text-amber-300 font-bold text-xs md:text-sm">${safeTrans}</p>
        </div>
      `;

      m1Feed.appendChild(row);
      m1Feed.scrollTop = m1Feed.scrollHeight;
    }

    function appendTwoWayBubble(orig, trans, isUser, tgtLangCode) {
      const bubble = document.createElement('div');
      bubble.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} space-y-1`;

      const bgClass = isUser ? 'bg-sky-950 border-sky-800/80 text-sky-100' : 'bg-amber-950 border-amber-800/80 text-amber-100';
      const alignClass = isUser ? 'rounded-2xl rounded-tr-none' : 'rounded-2xl rounded-tl-none';
      const safeTrans = escapeHtml(trans);

      bubble.innerHTML = `
        <span class="text-[9px] text-slate-500 font-mono px-1">${isUser ? 'Bạn' : 'Đối phương'}</span>
        <div class="max-w-[88%] p-2 border ${bgClass} ${alignClass} space-y-1 shadow">
          <p class="text-xs opacity-80 italic">${escapeHtml(orig)}</p>
          <div class="flex items-center justify-between gap-2 pt-1 border-t border-white/10">
            <p class="text-xs font-bold text-white">${safeTrans}</p>
            <button onclick="speakText('${safeTrans.replace(/'/g, "\\'")}', '${tgtLangCode}')" class="text-emerald-400 p-0.5 shrink-0">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>
          </div>
        </div>
      `;

      m2Feed.appendChild(bubble);
      m2Feed.scrollTop = m2Feed.scrollHeight;
    }

    async function translateTextAPI(text, src, tgt) {
      if (!text) return '';
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data[0]) return data[0].map(item => item[0]).join('');
        }
      } catch (err) {}
      return text;
    }

    function speakText(text, langCode) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function startAudioPipeline() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(mediaStream);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = gainMultiplier;

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;

        source.connect(gainNode);
        gainNode.connect(analyserNode);
        processPitch();
      } catch (e) {}
    }

    function processPitch() {
      if (!analyserNode) return;
      const data = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(data);

      let totalEnergy = 0;
      let weightedFreq = 0;
      for (let i = 0; i < data.length; i++) {
        totalEnergy += data[i];
        weightedFreq += data[i] * (i + 1);
      }
      if (totalEnergy > 50) { 
        const currentCentroid = weightedFreq / totalEnergy;
        currentPhrasePitches.push(currentCentroid * 20); 
      }
      if (isListeningMode1 || activeTwoWayMic) setTimeout(processPitch, 100);
    }

    function stopAudioAndSpeech() {
      if (recognition) { try { recognition.stop(); } catch(e){} }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
    }

    function restartSpeechEngine(langCode) {
      if (!recognition) return;
      try { recognition.stop(); } catch(e){}
      recognition.lang = langCode;
      setTimeout(() => { try { recognition.start(); } catch(e){} }, 150);
    }

    gainSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      gainMultiplier = val / 100;
      gainValText.innerText = val + "%";
      if (gainNode) gainNode.gain.value = gainMultiplier;
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
